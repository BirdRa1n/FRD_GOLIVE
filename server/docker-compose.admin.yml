# Override OPT-IN que habilita o painel admin de atualização.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.admin.yml up -d --build
#
# ATENÇÃO DE SEGURANÇA: isto monta o socket do Docker no token-service, o que
# equivale a acesso root ao host. Só use atrás de uma rede privada (ex.: Tailscale)
# e com o ORG_SECRET forte. HOST_REPO_DIR deve ser o caminho ABSOLUTO do repositório
# clonado no host (o mesmo que contém esta pasta server/).

services:
  token-service:
    environment:
      ADMIN_UI: "on"
      # Caminho do repo no HOST (o container updater monta isto em /repo).
      HOST_REPO_DIR: "${HOST_REPO_DIR:?defina HOST_REPO_DIR no .env, ex.: /opt/frd-golive}"
      REPO_DIR: "/repo"
    volumes:
      # Repo clonado (para ler a versão atual via git dentro do container).
      - "${HOST_REPO_DIR}:/repo:ro"
      # Socket do Docker para lançar o container updater.
      - "/var/run/docker.sock:/var/run/docker.sock"
