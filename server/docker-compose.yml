services:
  # Hub/auth/admin/config + mídia do Go Live NATIVO (server/src/nativeStream.ts).
  # Controle HTTP/WS pelo Cloudflare; a mídia (vídeo+áudio) entra pela porta UDP
  # NATIVE_STREAM_UDP_PORT no IP público NATIVE_STREAM_PUBLIC_IP (VPS/relay).
  server:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8090}:8090"
      # mídia do Go Live nativo (vídeo+áudio privados) — UDP
      - "${NATIVE_STREAM_UDP_PORT:-7883}:${NATIVE_STREAM_UDP_PORT:-7883}/udp"
    volumes:
      - ./data:/app/data
