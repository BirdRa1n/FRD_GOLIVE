# Configuração do LiveKit (SFU).
# As chaves de API (keys) NÃO ficam aqui — são injetadas via variável de ambiente
# LIVEKIT_KEYS pelo docker-compose, para não versionar segredos.

port: 7880

rtc:
  tcp_port: 7881
  # Uma ÚNICA porta UDP multiplexada para todo o tráfego de mídia (UDP mux).
  # NÃO use port_range_start/end aqui: publicar uma faixa grande no Docker cria
  # um processo docker-proxy por porta e esgota a RAM do host.
  udp_port: 7882
  # Em produção (VPS/servidor com IP público) deixe true para o SFU anunciar o IP
  # externo correto nos candidatos ICE. Em rede local, pode precisar ajustar.
  use_external_ip: true
  # IP público anunciado nos candidatos ICE. Deixe comentado para autodetecção.
  # Defina manualmente quando a MÍDIA entra por outro IP — ex.: um VPS que faz
  # relay do UDP para este servidor (aí ponha o IP do VPS e use_external_ip: false).
  # O instalador preenche isto se você informar um IP público para o WebRTC.
  # node_ip: 203.0.113.10

# TURN embutido do LiveKit — essencial em redes corporativas com NAT restritivo.
# Desligado por padrão (dev). Para habilitar em produção:
#   1. Aponte um domínio (ex.: media.suaempresa.com) para o servidor.
#   2. Forneça certificado TLS (cert_file/key_file) OU faça terminação TLS num
#      proxy à frente e use loadBalancerBehind.
#   3. Abra a tls_port (5349, idealmente também 443) no firewall.
turn:
  enabled: false
  domain: media.example.com
  tls_port: 5349
  # cert_file: /etc/livekit/turn/cert.pem
  # key_file: /etc/livekit/turn/key.pem

logging:
  level: info
