<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do app (fonte). Gere o PNG com: node scripts/render-icon.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7bff"/>
      <stop offset="0.55" stop-color="#2f62ff"/>
      <stop offset="1" stop-color="#5a4dff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3fc4"/>
      <stop offset="1" stop-color="#2a2f9e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ff4a5a" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- corpo no grid do macOS: 824×824 com margem de 100 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- monitor -->
  <rect x="236" y="300" width="552" height="360" rx="56" fill="#ffffff"/>
  <rect x="270" y="334" width="484" height="292" rx="30" fill="url(#screen)"/>
  <rect x="452" y="660" width="120" height="70" fill="#ffffff"/>
  <rect x="372" y="716" width="280" height="40" rx="20" fill="#ffffff"/>

  <!-- play: a tela indo para o servidor -->
  <path d="M470 410 Q470 392 486 401 L590 465 Q604 480 590 495 L486 559 Q470 568 470 550 Z" fill="#ffffff"/>

  <!-- ao vivo -->
  <circle cx="752" cy="320" r="62" fill="#ff4a5a" filter="url(#glow)"/>
  <circle cx="752" cy="320" r="62" fill="none" stroke="#ffffff" stroke-width="16"/>
</svg>
